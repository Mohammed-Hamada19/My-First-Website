<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحبا ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* الصفحة الأولى */
        #page1 {
            background: #000;
        }

        #enterBtn {
            padding: 18px 45px;
            border: none;
            border-radius: 50px;
            background: #ff1744;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.7);
        }

        #enterBtn:active {
            transform: scale(0.95);
        }

        /* الصفحة الثانية */
        #page2 {
            display: none;
            background: #000;
            color: white;
            text-align: center;
        }

        #page2 h1 {
            font-size: 55px;
            margin: 0 0 20px;
        }

        .heart {
            font-size: 80px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }
    </style>
</head>

<body>

    <!-- الصفحة الأولى -->
    <div id="page1" class="page">
        <button id="enterBtn">ادخل ❤️</button>
    </div>

    <!-- الصفحة الثانية -->
    <div id="page2" class="page">
        <h1>مرحبا</h1>
        <div class="heart">❤️</div>
    </div>

    <!-- الأغنية -->
    <audio id="music" loop preload="auto">
        <source
            src="https://files.catbox.moe/4zig9x.mp4"
            type="audio/mp4"
        >
    </audio>

    <script>
        const enterBtn = document.getElementById("enterBtn");
        const page1 = document.getElementById("page1");
        const page2 = document.getElementById("page2");
        const music = document.getElementById("music");

        enterBtn.addEventListener("click", async function () {

            // إظهار الصفحة الثانية
            page1.style.display = "none";
            page2.style.display = "flex";

            // تشغيل الأغنية فورًا بعد ضغطة المستخدم
            try {
                music.currentTime = 0;
                await music.play();
            } catch (error) {
                console.log("لم يتم تشغيل الأغنية:", error);
            }

        });
    </script>

</body>
</html>
