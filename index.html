<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحبا ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #startPage,
        #welcomePage {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #startPage {
            background: #000;
        }

        #startButton {
            padding: 18px 45px;
            border: 0;
            border-radius: 50px;
            background: #ff1744;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        #welcomePage {
            display: none;
            background: #000;
            color: white;
        }

        #welcomePage h1 {
            margin: 0;
            font-size: 55px;
        }

        .heart {
            margin-top: 20px;
            font-size: 80px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div id="startPage">
        <button id="startButton">ادخل ❤️</button>
    </div>

    <div id="welcomePage">
        <h1>مرحبا</h1>
        <div class="heart">❤️</div>
    </div>

    <audio id="music" loop preload="auto">
        <source src="https://files.catbox.moe/4zig9x.mp4" type="audio/mp4">
    </audio>

    <script>
        const button = document.getElementById("startButton");
        const startPage = document.getElementById("startPage");
        const welcomePage = document.getElementById("welcomePage");
        const music = document.getElementById("music");

        button.onclick = function () {
            startPage.style.display = "none";
            welcomePage.style.display = "flex";

            music.currentTime = 0;

            music.play().catch(function (error) {
                console.log(error);
            });
        };
    </script>

</body>
</html>
