<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحبا</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 50px;
        }

        audio {
            display: none;
        }
    </style>
</head>

<body>

    <h1>مرحبا ❤️</h1>

    <audio id="music" autoplay loop playsinline preload="auto">
        <source src="https://files.catbox.moe/4zig9x.mp4" type="audio/mp4">
    </audio>

    <script>
        const music = document.getElementById("music");

        window.addEventListener("load", () => {
            music.play().catch(() => {
                console.log("المتصفح منع التشغيل التلقائي");
            });
        });
    </script>

</body>
</html>
