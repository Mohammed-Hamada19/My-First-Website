<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحبا</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        #welcome {
            display: none;
            text-align: center;
        }

        #welcome h1 {
            font-size: 50px;
        }

        #welcome .heart {
            font-size: 80px;
        }

        #enter {
            padding: 15px 35px;
            font-size: 20px;
            background: red;
            color: white;
            border: 0;
            border-radius: 30px;
        }
    </style>
</head>

<body>

    <button id="enter">ادخل ❤️</button>

    <div id="welcome">
        <h1>مرحبا</h1>
        <div class="heart">❤️</div>
    </div>

    <audio id="song" loop preload="auto">
        <source src="https://files.catbox.moe/4zig9x.mp4">
    </audio>

    <script>
        document.getElementById("enter").addEventListener("click", function () {

            document.getElementById("enter").style.display = "none";
            document.getElementById("welcome").style.display = "block";

            var song = document.getElementById("song");

            song.load();

            var play = song.play();

            if (play !== undefined) {
                play.catch(function(error) {
                    console.log("Audio:", error);
                });
            }
        });
    </script>

</body>
</html>
