<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة القلوب والتهنئة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0210;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* تنسيق صفحة القلوب المتصاعدة */
        #fireworks-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2d0b36 0%, #0b0210 100%);
            overflow: hidden;
        }

        /* عنصر القلوب العائمة */
        .floating-bg-heart {
            position: absolute;
            bottom: -60px;
            z-index: 5;
            pointer-events: none;
            user-select: none;
            animation: floatUp linear forwards;
            opacity: 0.85;
            filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.7));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(-10deg);
                opacity: 0;
            }
            15% {
                opacity: 0.95;
            }
            85% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-115vh) scale(1.3) rotate(20deg);
                opacity: 0;
            }
        }

        /* شظايا انفجار القلب */
        .heart-shard {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            font-size: 24px;
            animation: shardExplode 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes shardExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(360deg);
            }
        }

        /* عناصر الواجهة */
        .card-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 400px;
        }

        #beating-heart {
            font-size: 80px;
            cursor: pointer;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out;
            user-select: none;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        #love-text {
            display: none;
            font-size: 22px;
            color: #ff4d8d;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 77, 141, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, #ff0055, #ff5050);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية للقلوب والتأثير النهائي -->
    <div id="fireworks-page">
        <div class="card-container">
            <div id="beating-heart" onclick="explodeHeart()">❤️</div>
            <div id="love-text">
                كل لحظة وأنتِ بوسط قلبي، <br>
                أتمنى لكِ أيماً مليئة بالحب والسعادة! ✨
            </div>
            <div>
                <button class="btn" onclick="goBackFromFireworks()">رجوع</button>
            </div>
        </div>
    </div>

    <script>
        let fireworksActive = true;
        const finalAudio = new Audio(); // يمكنك إضافة مسار الصوت هنا إذا رغبت

        // تشغيل تأثير القلوب المتصاعدة
        window.onload = function() {
            initFireworks();
        };

        function goToFireworksPage() {
            const finalDest = document.getElementById("final-destination-page");
            if (finalDest) finalDest.style.display = "none";
            
            document.getElementById("fireworks-page").style.display = "flex";
            
            fireworksActive = true;
            initFireworks();
            
            finalAudio.play().catch(e => console.log("Final audio error:", e));
        }

        function goBackFromFireworks() {
            fireworksActive = false;

            finalAudio.pause();
            finalAudio.currentTime = 0;

            document.getElementById("fireworks-page").style.display = "none";
            
            const finalDest = document.getElementById("final-destination-page");
            if (finalDest) finalDest.style.display = "flex";
            
            const continueContainer = document.getElementById("continue-container");
            if (continueContainer) continueContainer.style.display = "flex";
        }

        function explodeHeart() {
            const heart = document.getElementById("beating-heart");
            const loveText = document.getElementById("love-text");
            if (!heart || !loveText) return;

            const rect = heart.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 35; i++) {
                const shard = document.createElement("div");
                shard.classList.add("heart-shard");
                shard.innerText = "❤️";
                shard.style.left = centerX + "px";
                shard.style.top = centerY + "px";

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 250 + 80;
                const dx = Math.cos(angle) * distance + "px";
                const dy = Math.sin(angle) * distance + "px";

                shard.style.setProperty("--dx", dx);
                shard.style.setProperty("--dy", dy);

                document.body.appendChild(shard);
                setTimeout(() => shard.remove(), 1200);
            }

            heart.style.display = "none";
            loveText.style.display = "block";
        }

        /* إنشاء القلوب المتصاعدة بدلاً من الألعاب النارية */
        function initFireworks() {
            const container = document.getElementById("fireworks-page");
            if (!container) return;

            const heartInterval = setInterval(() => {
                if (!fireworksActive) {
                    clearInterval(heartInterval);
                    return;
                }
                createRisingHeart(container);
            }, 300);
        }

        function createRisingHeart(parent) {
            const heart = document.createElement("div");
            heart.classList.add("floating-bg-heart");
            heart.innerText = "❤️";

            const randomX = Math.random() * 90;
            const randomSize = Math.floor(Math.random() * 35) + 25;
            const randomDuration = (Math.random() * 3 + 3).toFixed(1);

            heart.style.left = randomX + "vw";
            heart.style.fontSize = randomSize + "px";
            heart.style.animationDuration = randomDuration + "s";

            parent.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, randomDuration * 1000);
        }
    </script>
</body>
</html>
