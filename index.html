<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الفيديو التفاعلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls-panel {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="video-wrapper">
            <video id="mainVideo" controls preload="metadata">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <div class="controls-panel">
            <div>
                <h1 class="title">مشغّل الفيديو التفاعلي</h1>
                <p class="status" id="videoStatus">الحالة: متوقف</p>
            </div>

            <div class="btn-group">
                <button class="btn" id="playPauseBtn" onclick="togglePlay()">تشغيل / إيقاف</button>
                <button class="btn btn-secondary" onclick="restartVideo()">إعادة من البداية</button>
                <button class="btn btn-secondary" onclick="toggleMute()" id="muteBtn">كتم الصوت</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const statusText = document.getElementById('videoStatus');
        const muteBtn = document.getElementById('muteBtn');

        function togglePlay() {
            if (video.paused) {
                video.play();
                statusText.textContent = 'الحالة: جاري التشغيل';
            } else {
                video.pause();
                statusText.textContent = 'الحالة: متوقف مؤقتاً';
            }
        }

        function restartVideo() {
            video.currentTime = 0;
            video.play();
            statusText.textContent = 'الحالة: جاري التشغيل';
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? 'إلغاء كتم الصوت' : 'كتم الصوت';
        }

        video.addEventListener('ended', () => {
            statusText.textContent = 'الحالة: انتهى التشغيل';
        });
    </script>

</body>
</html>
