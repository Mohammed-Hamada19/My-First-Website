<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحبا</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 50px;
        }
    </style>
</head>

<body>

    <h1>مرحبا ❤️</h1>

    <audio
        id="music"
        autoplay
        loop
        preload="auto"
        playsinline
    >
        <source
            src="https://files.catbox.moe/4zig9x.mp4"
            type="audio/mp4"
        >
    </audio>

    <script>
        const music = document.getElementById("music");

        // محاولة التشغيل فور تحميل الصفحة
        window.addEventListener("load", async () => {
            try {
                await music.play();
                console.log("تم تشغيل الأغنية تلقائياً");
            } catch (error) {
                console.log("المتصفح منع التشغيل التلقائي:", error);
            }
        });
    </script>

</body>
</html>
